name: SF32LB57 fork build checks

on:
  push:
    branches: [feature/sf32lb57]
  pull_request:
    paths:
      - '.github/workflows/sf32lb57-build.yml'
      - 'Kconfig'
      - 'components/**'
      - 'examples/get-started/hello_world/**'
      - 'examples/get-started/sf32lb57_bringup/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [sf32lb57, esp32c3, esp32s3]
    env:
      IDF_PYTHON_CHECK_CONSTRAINTS: 'no'
      ESP_IDF_VERSION: '6.1.1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ESP-IDF build tools
        if: matrix.target != 'sf32lb57'
        run: |
          python -m venv "$RUNNER_TEMP/idf-python"
          echo "$RUNNER_TEMP/idf-python/bin" >> "$GITHUB_PATH"
          echo "IDF_PYTHON_ENV_PATH=$RUNNER_TEMP/idf-python" >> "$GITHUB_ENV"
          echo "IDF_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/idf-python/bin/pip" install -r tools/requirements/requirements.core.txt cmake ninja
      - name: Install SF32LB57 tools and SiFli SDK
        if: matrix.target == 'sf32lb57'
        run: |
          ./install.sh sf32lb57
          . ./export.sh
          git clone --depth 1 --branch v2.5.2 --recurse-submodules --shallow-submodules https://github.com/OpenSiFli/SiFli-SDK "$RUNNER_TEMP/SiFli-SDK"
          echo "SIFLI_SDK=$RUNNER_TEMP/SiFli-SDK" >> "$GITHUB_ENV"
          python -m pip install -r "$RUNNER_TEMP/SiFli-SDK/tools/requirements/requirements.core.txt" cmake ninja
          arm-none-eabi-gcc --version
          sftool --version
      - name: Install Espressif compiler
        if: matrix.target != 'sf32lb57'
        run: |
          if [[ "$TARGET" == esp32c3 ]]; then
            tool=riscv32-esp-elf
          else
            tool=xtensa-esp-elf
          fi
          python tools/idf_tools.py install "$tool" esp-rom-elfs
          tools_dir="${IDF_TOOLS_PATH:-$HOME/.espressif}/tools"
          find "$tools_dir/$tool" -type d -name bin >> "$GITHUB_PATH"
          rom_dir=$(find "$tools_dir/esp-rom-elfs" -mindepth 1 -maxdepth 1 -type d -print -quit)
          echo "ESP_ROM_ELF_DIR=$rom_dir" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - name: Build upstream hello_world
        run: |
          if [[ "$TARGET" == sf32lb57 ]]; then
            . ./export.sh
          fi
          python tools/idf.py -C examples/get-started/hello_world set-target "$TARGET"
          python tools/idf.py -C examples/get-started/hello_world build
        env:
          TARGET: ${{ matrix.target }}
      - name: Build SF32LB57 bring-up and test app-flash
        if: matrix.target == 'sf32lb57'
        run: |
          . ./export.sh
          idf.py -C examples/get-started/sf32lb57_bringup set-target sf32lb57
          idf.py -C examples/get-started/sf32lb57_bringup app
          python -m unittest discover -s tools/sf32lb57 -p 'test_*.py'
